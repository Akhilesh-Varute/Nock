name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\nock.iss
      - name: Name the no-install version clearly
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item target\release\nock.exe "Nock-portable-$v.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/NockSetup-*.exe
            Nock-portable-*.exe
          body: |
            **Most people: download `NockSetup-...exe` (the installer).** It adds Nock to the Start menu, can start with Windows, and updates itself from the tray menu.

            **Don't want to install? Use `Nock-portable-...exe`.** Put it in a folder you'll keep and run it. No Start menu entry beyond the one Nock adds itself, and it can update itself from the tray menu too.
          generate_release_notes: true

  # Linux preview packages join the release the Windows job created.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Build packages
        run: packaging/linux/package.sh "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/linux/out/nock_*_amd64.deb
            packaging/linux/out/nock-*-x86_64-linux.tar.gz
