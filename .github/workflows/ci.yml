name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=0.0.0-ci" installer\nock.iss
      - name: Installer smoke test (silent install, check, uninstall)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "NockInstallTest"
          Start-Process -Wait -FilePath "installer\Output\NockSetup-0.0.0-ci.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir"
          if (-not (Test-Path "$dir\nock.exe")) { throw "nock.exe was not installed" }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Nock.lnk"
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut missing" }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\nock.exe") { throw "uninstall left nock.exe behind" }
          if (Test-Path $lnk) { throw "uninstall left the shortcut behind" }
          "installer OK"
      - uses: actions/upload-artifact@v4
        with:
          name: nock-windows
          path: |
            target/release/nock.exe
            installer/Output/NockSetup-*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core xvfb xdotool
      - run: cargo build --release
      - run: cargo test --release
      - name: Build packages
        run: packaging/linux/package.sh 0.0.0-ci
      - name: Package smoke test (install the .deb, start it, uninstall)
        run: |
          sudo apt-get install -y ./packaging/linux/out/nock_0.0.0-ci_amd64.deb
          test -x /usr/bin/nock
          test -f /usr/share/applications/nock.desktop
          # a clean start must keep running (timeout kills it after 6 s and exits with 124)
          code=0
          xvfb-run -a timeout 6 nock || code=$?
          test "$code" = 124 || { echo "nock exited early with $code"; exit 1; }
          sudo apt-get remove -y nock
          test ! -e /usr/bin/nock
      - uses: actions/upload-artifact@v4
        with:
          name: nock-linux
          path: packaging/linux/out/*
